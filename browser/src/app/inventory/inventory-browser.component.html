<c8y-title>{{ pageTitle }}</c8y-title>
<c8y-action-bar-item placement="left" [priority]="40">
  <button type="button" class="btn btn-link" [disabled]="!nav.canGoBack()" (click)="nav.back()">
    <i c8yIcon="arrow-left"></i> Back
  </button>
</c8y-action-bar-item>
<c8y-action-bar-item placement="left" [priority]="30">
  <button type="button" class="btn btn-link" [disabled]="!nav.canGoParent()" (click)="nav.parent()">
    <i c8yIcon="arrow-up"></i> Up
  </button>
</c8y-action-bar-item>
<c8y-action-bar-item placement="left" [priority]="20">
  <button type="button" class="btn btn-link" [disabled]="!nav.canGoPrev()" (click)="nav.prev()">
    <i c8yIcon="chevron-left"></i> Prev
  </button>
</c8y-action-bar-item>
<c8y-action-bar-item placement="left" [priority]="10">
  <button type="button" class="btn btn-link" [disabled]="!nav.canGoNext()" (click)="nav.next()">
    Next <i c8yIcon="chevron-right"></i>
  </button>
</c8y-action-bar-item>
<c8y-action-bar-item placement="left" [priority]="5">
  <app-identities></app-identities>
</c8y-action-bar-item>
<c8y-action-bar-item placement="right" [priority]="10">
  <button type="button" class="btn btn-link" title="Refresh" (click)="nav.refresh()">
    <i c8yIcon="refresh"></i> Refresh
  </button>
</c8y-action-bar-item>

<div class="inventory-browser">
  <div class="resizable-region" #resizableRegion>
    <app-inventory-search [heightPx]="searchHeightPx" (collapsedChange)="searchCollapsed = $event"></app-inventory-search>
    <div
      class="divider"
      [hidden]="searchCollapsed"
      [class.dragging]="resizing"
      (mousedown)="onDividerMouseDown($event)"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize search results / JSON view"
    ></div>
    <app-managed-object-view></app-managed-object-view>
  </div>
</div>
